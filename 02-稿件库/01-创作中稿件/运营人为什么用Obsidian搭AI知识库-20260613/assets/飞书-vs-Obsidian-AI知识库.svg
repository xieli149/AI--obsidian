<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text x="640" y="74" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="42" font-weight="700" fill="#0F172A">运营人搭 AI 知识库：工具不是越多越好</text>
  <text x="640" y="124" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24" fill="#475569">团队协作用飞书，个人沉淀用 Obsidian</text>

  <rect x="92" y="174" width="510" height="410" rx="28" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/>
  <circle cx="158" cy="238" r="34" fill="#DBEAFE"/>
  <text x="158" y="250" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="32" font-weight="700" fill="#2563EB">协</text>
  <text x="218" y="248" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="34" font-weight="700" fill="#1E3A8A">飞书：协作场</text>
  <text x="130" y="314" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="25" fill="#334155">适合多人一起推进工作</text>
  <line x1="130" y1="344" x2="560" y2="344" stroke="#E2E8F0" stroke-width="2"/>
  <text x="150" y="398" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="25" fill="#0F172A">多人编辑、评论、审批</text>
  <text x="150" y="455" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="25" fill="#0F172A">项目资料同步给团队</text>
  <text x="150" y="512" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="25" fill="#0F172A">对外交付更清晰方便</text>

  <rect x="678" y="174" width="510" height="410" rx="28" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="3"/>
  <circle cx="744" cy="238" r="34" fill="#DCFCE7"/>
  <text x="744" y="250" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="32" font-weight="700" fill="#16A34A">库</text>
  <text x="804" y="248" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="34" font-weight="700" fill="#166534">Obsidian：资产库</text>
  <text x="716" y="314" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="25" fill="#334155">适合沉淀自己的长期素材</text>
  <line x1="716" y1="344" x2="1146" y2="344" stroke="#E2E8F0" stroke-width="2"/>
  <text x="736" y="398" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="25" fill="#0F172A">Markdown 文件，AI 更好读</text>
  <text x="736" y="455" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="25" fill="#0F172A">本地保存，资料边界清楚</text>
  <text x="736" y="512" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="25" fill="#0F172A">双链图谱，素材能串起来</text>

  <rect x="220" y="626" width="840" height="54" rx="27" fill="#0F172A"/>
  <text x="640" y="662" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24" font-weight="600" fill="#FFFFFF">不是换一个笔记软件，而是给 AI 准备一个能长期读取的内容底盘</text>
</svg>
